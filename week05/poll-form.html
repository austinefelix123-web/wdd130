<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 130 | HTML Form - User Poll</title>
</head>

<body>

    <header>
        <h1>WDD 130 | HTML Form - User poll</h1>
    </header>

    <main>
        <form>
            <!-- Contact Information Section -->
            <fieldset>
                <legend>Contact Information</legend>

                <!-- Full Name Field -->
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>

                <!-- Email Field -->
                <label for="useremail">Email:</label>
                <input type="email" id="useremail" name="useremail" required>
            </fieldset>

            <!-- Questions Section -->
            <fieldset>
                <legend>Questions</legend>

                <!-- Favorite Browser Selection -->
                <label for="browser">What is your favorite internet?</label>
                <select id="browser" name="browser">
                    <option value="chrome">Chrome</option>
                    <option value="firefox">Firefox</option>
                    <option value="edge">Edge</option>
                    <option value="brave">Brave</option>
                    <option value="other">Other</option>
                </select>

                <!-- Household Pet Checkbox -->
                <label for="pet">Do you have a household pet?</label>
                <input type="checkbox" id="pet" name="pet">

                <!-- Places Lived Textarea -->
                <label for="feedback">List the Places you have lived:</label>
                <textarea id="feedback" name="feedback" rows="4"
                  placeholder="Stillwater Florida, Amsterdam"></textarea>
            </fieldset>

            <!-- Submit Button -->
            <button type="submit">Submit Poll</button>
        </form>
    </main>

    <footer>
        <p>&copy;2026 | HTML Form - User Poll Activity</p>
    </footer>
</body>

</html>
